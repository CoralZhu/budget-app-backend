# Production profile - for Render deployment
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate validate-only mode (don't auto-modify schema since tables already exist)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

# DeepSeek (used by OCR receipt parsing)
deepseek.api-key=${DEEPSEEK_API_KEY}
deepseek.api-url=https://api.deepseek.com
deepseek.model=deepseek-chat

# Aliyun OCR
aliyun.access-key-id=${ALIYUN_ACCESS_KEY_ID}
aliyun.access-key-secret=${ALIYUN_ACCESS_KEY_SECRET}
aliyun.ocr.region=cn-hangzhou

# Multipart
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server port (Render injects PORT env var)
server.port=${PORT:8080}

# Disable mail config in prod (not used)
spring.mail.host=disabled
spring.mail.username=disabled
spring.mail.password=disabled

# Custom flag for app-level branching
app.skip-email-verification=true
