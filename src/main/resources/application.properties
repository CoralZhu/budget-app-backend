spring.application.name=budget-app
spring.profiles.active=local

server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ai_budget_app}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:zhuxiangcun}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=604800000

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

aliyun.access-key-id=${ALIYUN_ACCESS_KEY_ID}
aliyun.access-key-secret=${ALIYUN_ACCESS_KEY_SECRET}
aliyun.ocr.region=cn-hangzhou

deepseek.api-key=${DEEPSEEK_API_KEY}
deepseek.api-url=https://api.deepseek.com
deepseek.model=deepseek-chat

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
